<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tablero de mensajes</title>
</head>
<body>
  <h1>Tablero de mensajes</h1>
  <p>Hay {{ publicaciones|length }} publicaciones.</p>
  <ul>
    {% for publicacion in publicaciones %}
      <li>{{ publicacion.texto }}</li>
    {% empty %}
      <li>Todavía no hay publicaciones.</li>
    {% endfor %}
  </ul>
</body>
</html>
